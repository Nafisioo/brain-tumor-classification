name: Brain Tumor API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Linting
        run: |
          # Fails the pipeline if code isn't formatted properly
          black --check .
          flake8 .

      - name: Run pytest
        run: |
          pytest \
          --cov=api \
          --cov=inference \
          --cov-report=term-missing

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
          -t brain-tumor-api:test .

      - name: Start container
        run: |
          docker run \
          -d \
          --name brain-tumor-api-test \
          -p 8000:8000 \
          brain-tumor-api:test

      - name: Wait for API & Health Check
        run: |
          echo "Waiting for API to spin up..."
          curl --fail \
               --retry 15 \
               --retry-delay 2 \
               --retry-all-errors \
               --retry-connrefused \
               http://localhost:8000/health

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          echo "Health check failed! Printing container logs:"
          docker logs brain-tumor-api-test

      - name: Stop container
        if: always()
        run: |
          docker stop brain-tumor-api-test || true